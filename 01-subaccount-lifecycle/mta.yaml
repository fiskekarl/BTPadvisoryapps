_schema-version: '3.1'
ID: btp-subaccount-lifecycle
version: 1.0.0
description: SAP BTP Subaccount Lifecycle & Drift Tracker — advisory app

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - echo "omit=dev" > gen/srv/.npmrc
        - npm ci --prefix app/lifecycle-dashboard

modules:

  # ─── 1. SAPUI5 Frontend ────────────────────────────────────────────────────
  - name: lifecycle-ui
    type: html5
    path: app/lifecycle-dashboard
    build-parameters:
      builder: custom
      commands:
        - npm run build
      supported-platforms: []

  # ─── 2. UI5 App Deployer ────────────────────────────────────────────────────
  - name: lifecycle-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: lifecycle-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources/
      requires:
        - name: lifecycle-ui
          artifacts:
            - lifecycle-dashboard.zip
          target-path: resources/

  # ─── 3. CAP Node.js Backend ─────────────────────────────────────────────────
  - name: lifecycle-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 512M
      disk-quota: 1024M
      instances: 1
    requires:
      - name: lifecycle-xsuaa
      - name: lifecycle-cis
      - name: lifecycle-audit-log
    provides:
      - name: lifecycle-srv-api
        public: true
        properties:
          srv-url: ${default-url}

  # ─── 4. Destination Content ─────────────────────────────────────────────────
  - name: lifecycle-destination-content
    type: com.sap.application.content
    requires:
      - name: lifecycle-destination-service
        parameters:
          content-target: true
      - name: lifecycle-xsuaa
        parameters:
          service-key:
            name: lifecycle-xsuaa-key
      - name: lifecycle-html5-repo-host
        parameters:
          service-key:
            name: lifecycle-html5-repo-host-key
    parameters:
      content:
        instance:
          destinations:
            - Authentication: OAuth2UserTokenExchange
              Name: lifecycle-srv-destination
              HTML5.ForwardAuthToken: true
              TokenServiceInstanceName: lifecycle-xsuaa
              TokenServiceKeyName: lifecycle-xsuaa-key
              URL: ~{lifecycle-srv-api/srv-url}
              sap.cloud.service: com.btpconsulting.subaccountlifecycle
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:

  # ─── XSUAA ──────────────────────────────────────────────────────────────────
  - name: lifecycle-xsuaa
    type: com.sap.xs.uaa
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: btp-subaccount-lifecycle-${org}-${space}
        tenant-mode: dedicated

  # ─── CIS ────────────────────────────────────────────────────────────────────
  # Plan: central → required scopes: cis-central!b14.global-account.read
  # Used for: Accounts API, Entitlements API, role-collection enumeration.
  - name: lifecycle-cis
    type: org.cloudfoundry.managed-service
    parameters:
      service: cis
      service-plan: central

  # ─── Audit Log Retrieval Service ────────────────────────────────────────────
  # Plan: oauth2 (or default depending on region)
  # Used for: per-subaccount activity and admin-action audit trail.
  - name: lifecycle-audit-log
    type: org.cloudfoundry.managed-service
    parameters:
      service: auditlog-management
      service-plan: default

  # ─── HTML5 Repo Host ────────────────────────────────────────────────────────
  - name: lifecycle-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # ─── Destination Service ────────────────────────────────────────────────────
  - name: lifecycle-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: ui5
                Description: SAP UI5 CDN
                URL: https://ui5.sap.com
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
