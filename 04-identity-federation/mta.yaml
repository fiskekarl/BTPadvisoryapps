_schema-version: '3.1'
ID: btp-identity-federation
version: 1.0.0
description: SAP BTP CIS/IAS Identity Federation Health Check — advisory app

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - echo "omit=dev" > gen/srv/.npmrc
        - npm ci --prefix app/identity-dashboard

modules:

  - name: ident-ui
    type: html5
    path: app/identity-dashboard
    build-parameters: { builder: custom, commands: [npm run build], supported-platforms: [] }

  - name: ident-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - { name: ident-html5-repo-host, parameters: { content-target: true } }
    build-parameters:
      build-result: resources/
      requires:
        - name: ident-ui
          artifacts: [identity-dashboard.zip]
          target-path: resources/

  - name: ident-srv
    type: nodejs
    path: gen/srv
    parameters: { memory: 512M, disk-quota: 1024M, instances: 1 }
    requires:
      - name: ident-xsuaa
      - name: ident-cis
    provides:
      - name: ident-srv-api
        public: true
        properties: { srv-url: ${default-url} }

  - name: ident-destination-content
    type: com.sap.application.content
    requires:
      - { name: ident-destination-service, parameters: { content-target: true } }
      - { name: ident-xsuaa, parameters: { service-key: { name: ident-xsuaa-key } } }
      - { name: ident-html5-repo-host, parameters: { service-key: { name: ident-html5-repo-host-key } } }
    parameters:
      content:
        instance:
          destinations:
            - Authentication: OAuth2UserTokenExchange
              Name: ident-srv-destination
              HTML5.ForwardAuthToken: true
              TokenServiceInstanceName: ident-xsuaa
              TokenServiceKeyName: ident-xsuaa-key
              URL: ~{ident-srv-api/srv-url}
              sap.cloud.service: com.btpconsulting.identityfederation
          existing_destinations_policy: update
    build-parameters: { no-source: true }

resources:

  - name: ident-xsuaa
    type: com.sap.xs.uaa
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: btp-identity-federation-${org}-${space}
        tenant-mode: dedicated

  - name: ident-cis
    type: org.cloudfoundry.managed-service
    parameters: { service: cis, service-plan: central }

  - name: ident-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters: { service: html5-apps-repo, service-plan: app-host }

  - name: ident-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - { Name: ui5, Description: SAP UI5 CDN, URL: https://ui5.sap.com, Type: HTTP, ProxyType: Internet, Authentication: NoAuthentication }
