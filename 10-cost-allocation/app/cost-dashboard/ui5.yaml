specVersion: "3.1"
metadata:
  name: com.btpconsulting.costallocation
type: application
framework:
  name: SAPUI5
  version: "1.120.18"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.suite.ui.commons
    - name: sap.ui.unified
    - name: sap.ui.export
builder:
  resources: { excludes: ["/test/**"] }
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateVersionInfo
      configuration: { archiveName: cost-dashboard, relativePaths: true, additionalFiles: [xs-app.json] }
