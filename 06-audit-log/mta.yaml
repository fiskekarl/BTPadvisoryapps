_schema-version: '3.1'
ID: btp-audit-log
version: 1.0.0
description: SAP BTP Audit-Log & Change Inventory Console — advisory app

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - echo "omit=dev" > gen/srv/.npmrc
        - npm ci --prefix app/audit-dashboard

modules:

  - name: audit-ui
    type: html5
    path: app/audit-dashboard
    build-parameters: { builder: custom, commands: [npm run build], supported-platforms: [] }

  - name: audit-ui-deployer
    type: com.sap.application.content
    path: .
    requires: [{ name: audit-html5-repo-host, parameters: { content-target: true } }]
    build-parameters:
      build-result: resources/
      requires: [{ name: audit-ui, artifacts: [audit-dashboard.zip], target-path: resources/ }]

  - name: audit-srv
    type: nodejs
    path: gen/srv
    parameters: { memory: 512M, disk-quota: 1024M, instances: 1 }
    requires:
      - name: audit-xsuaa
      - name: audit-cis
    provides:
      - name: audit-srv-api
        public: true
        properties: { srv-url: ${default-url} }

  - name: audit-destination-content
    type: com.sap.application.content
    requires:
      - { name: audit-destination-service, parameters: { content-target: true } }
      - { name: audit-xsuaa, parameters: { service-key: { name: audit-xsuaa-key } } }
      - { name: audit-html5-repo-host, parameters: { service-key: { name: audit-html5-repo-host-key } } }
    parameters:
      content:
        instance:
          destinations:
            - Authentication: OAuth2UserTokenExchange
              Name: audit-srv-destination
              HTML5.ForwardAuthToken: true
              TokenServiceInstanceName: audit-xsuaa
              TokenServiceKeyName: audit-xsuaa-key
              URL: ~{audit-srv-api/srv-url}
              sap.cloud.service: com.btpconsulting.auditlog
          existing_destinations_policy: update
    build-parameters: { no-source: true }

resources:
  - name: audit-xsuaa
    type: com.sap.xs.uaa
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: btp-audit-log-${org}-${space}
        tenant-mode: dedicated

  - name: audit-cis
    type: org.cloudfoundry.managed-service
    parameters: { service: cis, service-plan: central }

  - name: audit-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters: { service: html5-apps-repo, service-plan: app-host }

  - name: audit-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - { Name: ui5, Description: SAP UI5 CDN, URL: https://ui5.sap.com, Type: HTTP, ProxyType: Internet, Authentication: NoAuthentication }
