_schema-version: '3.1'
ID: btp-role-collection-map
version: 1.0.0
description: SAP BTP Role-Collection & Identity Map — advisory app

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - echo "omit=dev" > gen/srv/.npmrc
        - npm ci --prefix app/role-dashboard

modules:

  - name: role-ui
    type: html5
    path: app/role-dashboard
    build-parameters: { builder: custom, commands: [npm run build], supported-platforms: [] }

  - name: role-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - { name: role-html5-repo-host, parameters: { content-target: true } }
    build-parameters:
      build-result: resources/
      requires:
        - name: role-ui
          artifacts: [role-dashboard.zip]
          target-path: resources/

  - name: role-srv
    type: nodejs
    path: gen/srv
    parameters: { memory: 512M, disk-quota: 1024M, instances: 1 }
    requires:
      - name: role-xsuaa
      - name: role-cis
    provides:
      - name: role-srv-api
        public: true
        properties: { srv-url: ${default-url} }

  - name: role-destination-content
    type: com.sap.application.content
    requires:
      - { name: role-destination-service, parameters: { content-target: true } }
      - { name: role-xsuaa, parameters: { service-key: { name: role-xsuaa-key } } }
      - { name: role-html5-repo-host, parameters: { service-key: { name: role-html5-repo-host-key } } }
    parameters:
      content:
        instance:
          destinations:
            - Authentication: OAuth2UserTokenExchange
              Name: role-srv-destination
              HTML5.ForwardAuthToken: true
              TokenServiceInstanceName: role-xsuaa
              TokenServiceKeyName: role-xsuaa-key
              URL: ~{role-srv-api/srv-url}
              sap.cloud.service: com.btpconsulting.rolecollectionmap
          existing_destinations_policy: update
    build-parameters: { no-source: true }

resources:

  - name: role-xsuaa
    type: com.sap.xs.uaa
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: btp-role-collection-map-${org}-${space}
        tenant-mode: dedicated

  - name: role-cis
    type: org.cloudfoundry.managed-service
    parameters: { service: cis, service-plan: central }

  - name: role-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters: { service: html5-apps-repo, service-plan: app-host }

  - name: role-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - { Name: ui5, Description: SAP UI5 CDN, URL: https://ui5.sap.com, Type: HTTP, ProxyType: Internet, Authentication: NoAuthentication }
