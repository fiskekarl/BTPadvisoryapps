name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - 01-subaccount-lifecycle
          - 02-destination-inventory
          - 03-compliance-scorecard
          - 04-identity-federation
          - 05-role-collection-map
          - 06-audit-log
          - 07-entitlement-optimization
          - 08-ai-governance
          - 09-cert-expiry
          - 10-cost-allocation
          - 11-clean-core
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: development

      - name: Coverage
        run: npm run test:coverage -- --reporter=text-summary
        continue-on-error: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: ${{ matrix.app }}/coverage/
          retention-days: 7
          if-no-files-found: ignore
